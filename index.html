<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clicker Kingdom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">CLICKER KINGDOM</p>
        <h1>Buduj své království</h1>
      </div>
      <button id="resetButton" class="ghost-button" type="button">Reset hry</button>
    </header>

    <section class="stats-grid" aria-label="Herní statistiky">
      <div class="stat-card"><span>Mince</span><strong id="coins">0</strong></div>
      <div class="stat-card"><span>Za kliknutí</span><strong id="perClick">1</strong></div>
      <div class="stat-card"><span>Za sekundu</span><strong id="perSecond">0</strong></div>
      <div class="stat-card"><span>Celkem kliknutí</span><strong id="totalClicks">0</strong></div>
    </section>

    <section class="game-layout">
      <div class="click-panel panel">
        <div class="panel-heading">
          <span class="badge">TVÉ KRÁLOVSTVÍ</span>
          <span id="levelLabel">Úroveň 1</span>
        </div>
        <div class="coin-orb-wrap">
          <button id="coinButton" class="coin-orb" type="button" aria-label="Klikni na minci">🪙</button>
          <div id="clickMessage" class="click-message">Klikni a vydělávej!</div>
        </div>
        <div class="progress-label"><span>Pokrok k další úrovni</span><span id="progressText">0 / 100</span></div>
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
      </div>

      <aside class="shop panel">
        <div class="shop-heading"><div><span class="badge">OBCHOD</span><h2>Vylepšení</h2></div><span class="shop-icon">⚒️</span></div>
        <div id="upgrades" class="upgrade-list"></div>
      </aside>
    </section>

    <footer><span>Postup se ukládá automaticky do tohoto prohlížeče.</span><span>Made with ✨</span></footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
